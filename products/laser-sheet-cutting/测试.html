    <!-- 一、CSS 全局基础样式 -->
    <style>
      /* 1.1 全局样式重置 + 盒模型/字体统一（核心：消除浏览器默认差异） */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Public Sans", "Noto Sans SC", sans-serif;
      }

      /* 全局锁死：禁止任何横向溢出 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100vw; /* 永远不超过视口宽度 */
        overflow-x: hidden; /* 隐藏所有横向溢出内容 */
        box-sizing: border-box;
      }

      /* 所有元素继承盒模型，避免 padding/border 撑宽 */
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      /* 1.2 图标字体强制声明 */
      .social-icons .icon i,
      .footer-contact .contact-icon i {
        font-family: "FontAwesome" !important;
      }

      /* 1.3 全局复用工具类：元素隐藏类 */
      .hidden {
        display: none !important;
      }

      /* 1.4 全局复用工具类：页面固定类（用途：弹出卡片/弹窗时使用，禁止背景滚动且保留滚动条占位） */
      .body-fixed {
        position: fixed; /* 固定页面位置，防止背景随滚动移动 */
        width: 100%; /* 保持页面宽度，避免滚动条消失导致页面抖动 */
        overflow-y: auto; /* 关键：保留右侧滚动条占位，维持页面布局稳定性 */
      }

      @media (max-width: 320px) {
        html {
          font-size: 12px;
        }
      }

      @media (min-width: 321px) and (max-width: 375px) {
        html {
          font-size: 14px;
        }
      }

      @media (min-width: 376px) and (max-width: 425px) {
        html {
          font-size: 15px;
        }
      }

      @media (min-width: 426px) and (max-width: 768px) {
        html {
          font-size: 16px;
        }
      }

      @media (min-width: 769px) and (max-width: 1024px) {
        html {
          font-size: 16px;
        }
      }

      @media (min-width: 1025px) and (max-width: 2559px) {
        html {
          font-size: 16px;
        }
      }

      @media (min-width: 2560px) {
        html {
          font-size: 18px;
        }
      }
    </style>

    <!--二、CSS 导航栏-->
    <style>
      .navbar {
        position: fixed; /* 导航栏固定在屏幕上，滚动页面时它不会跑，一直停在顶部 */
        top: 0; /* FIX三件套：导航栏紧贴屏幕最上边 */
        left: 0; /* FIX三件套：导航栏紧贴屏幕最左边 */
        width: 100%; /* FIX三件套：导航栏宽度占满整个屏幕 */
        height: 2.8rem; /* 简单说就是导航栏的高度固定 */

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.8) 0%,
          rgba(248, 248, 250, 0.8) 50%,
          rgba(245, 245, 247, 1) 100%
        );
        z-index: 1000; /* 导航栏的层级很高（1000），不会被其他元素（比如图片、文字）盖住 */
        transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1); /* 导航栏的任何样式变化（比如背景、阴影）都会有0.4秒的过渡动画，动画节奏是先慢后快再慢，更丝滑 */
        display: flex; /* 导航栏里的元素（比如logo、菜单、按钮）用弹性布局排列 */
        justify-content: space-between; /* 导航栏里的元素左右两端对齐（比如logo靠左，按钮靠右） */
        align-items: center; /* 导航栏里的元素垂直方向居中（不会上下歪） */
        gap: 2rem; /* 导航栏里的元素之间留2个基准字体大小的空隙 */
        padding: 0 2rem; /* 导航栏内部左右各留2个基准字体大小的内边距（元素不会贴边） */
        box-sizing: border-box; /* 计算导航栏宽度时，把内边距和边框都算进去（不会因为padding撑宽导航栏） */
        box-shadow: 0 1px 8px rgb(245, 245, 257, 0.3); /* 导航栏底部加了一层浅阴影：水平偏移0，垂直偏移1px，模糊8px，颜色是浅透的蓝灰色，让导航栏有一点点悬浮的立体感 */
