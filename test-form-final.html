<!DOCTYPE html>
<html>
<head>
    <title>测试表单</title>
</head>
<body>
    <!-- 核心配置：name、method、data-netlify、隐藏字段、action 完全符合Netlify要求 -->
    <form name="test-form" method="POST" data-netlify="true" action="/test-success.html">
        <input type="hidden" name="form-name" value="test-form">
        <input type="text" name="name" placeholder="测试姓名" required>
        <button type="submit">提交测试</button>
    </form>
</body>
</html>
